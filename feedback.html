html,body{margin:0;padding:0;background:transparent;}
.uplab-fb{font-family:'Roboto',Arial,sans-serif;color:#292727;padding:4px;box-sizing:border-box;}
.uplab-fb *{box-sizing:border-box;}
.uplab-fb .fb-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-family:'Doppio One',Arial,sans-serif;font-variant-ligatures:none;font-size:15px;color:#292727;flex-wrap:wrap;}
.uplab-fb .fb-sub{font-size:12.5px;color:#666;margin:0 0 14px;}
.uplab-fb .fb-blok{background:#fafafa;border:1px solid #e0e0e0;border-radius:10px;padding:16px 18px;}
.uplab-fb .fb-blok + .fb-blok{margin-top:14px;}
.uplab-fb .fb-vraag{font-size:14px;font-weight:500;color:#292727;line-height:1.5;margin-bottom:12px;}
.uplab-fb .fb-item{border-left:3px solid #ccc;padding:2px 0 2px 12px;}
.uplab-fb .fb-item + .fb-item{margin-top:12px;}
.uplab-fb .fb-naam{font-size:13px;font-weight:700;margin-bottom:3px;}
.uplab-fb .fb-tekst{font-size:13.5px;line-height:1.6;color:#3a3a3a;}
.uplab-fb .fb-leeg{font-size:13px;color:#666;font-style:italic;background:#fafafa;border:1px solid #e0e0e0;border-left:4px solid #549E39;border-radius:10px;padding:16px 18px;}
.uplab-fb .fb-laad{font-size:13px;color:#666;padding:12px 2px;}
.uplab-fb .fb-slot{text-align:center;padding:24px 20px;background:#fafafa;border:1px solid #e0e0e0;border-left:4px solid #549E39;border-radius:10px;}
.uplab-fb .fb-slot p{margin:0;font-size:14px;line-height:1.6;color:#292727;}
</style>
</head>
<body>
<div class="uplab-fb" id="uplabFb"><div class="fb-laad">Even laden…</div></div>

<script>
(function () {
  'use strict';

  var SB_URL = 'https://iqrlerplitfvgdnqnyzd.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxcmxlcnBsaXRmdmdkbnFueXpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMzMwOTMsImV4cCI6MjA5NjgwOTA5M30.25Uzl2xpOZFqGYm3QSJpihkGz0y-rLczX5Iq49gIeoU';
  var LS_KEY = 'uplab_labboek_embed_v1';
  var KLEUREN = ['#549E39', '#2F6FED', '#8B5CF6', '#D97706', '#DB2777', '#0891B2'];

  var root = document.getElementById('uplabFb');
  var session = null;
  var geheugen = null;

  function leesSessie() {
    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = geheugen; }
    if (!raw) return null;
    try { var o = JSON.parse(raw); if (o && o.token && o.deelnemer_id) return o; } catch (e) {}
    return null;
  }
  function wisSessie() { geheugen = null; try { localStorage.removeItem(LS_KEY); } catch (e) {} session = null; }
  function hdrs() {
    var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
    if (session) h['x-sessie-token'] = session.token;
    return h;
  }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  function parse(r) { return r.json().catch(function () { return null; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); }

  var HEAD = '<div class="fb-head">🎙️ Feedback uit jouw omgeving</div>';

  function toonSlot() {
    root.innerHTML = HEAD + '<div class="fb-slot"><p>🔒 Log eerst in bovenaan dit hoofdstuk — dan verschijnt hier de feedback die je ontving.</p></div>';
  }

  function laad() {
    root.innerHTML = HEAD + '<div class="fb-laad">De feedback wordt geladen…</div>';
    fetch(SB_URL + '/rest/v1/labboek_relaties?deelnemer_id=eq.' + encodeURIComponent(session.deelnemer_id) + '&select=id,naam,feedback_ontvangen,feedback_op&order=aangemaakt_op.asc', { headers: hdrs() })
      .then(parse)
      .then(function (relRes) {
        if (!relRes.ok || !Array.isArray(relRes.j)) { wisSessie(); toonSlot(); return; }
        var relaties = relRes.j;
        var relatieIds = relaties.map(function (r) { return r.id; }).join(',');
        var kleurVan = {};
        relaties.forEach(function (r, i) { kleurVan[r.id] = KLEUREN[i % KLEUREN.length]; });

        if (!relatieIds) { render(relaties, [], kleurVan); return; }

        fetch(SB_URL + '/rest/v1/labboek_feedback?relatie_id=in.(' + relatieIds + ')&select=*&order=vraag_nr.asc,ingevuld_op.asc', { headers: hdrs() })
          .then(parse)
          .then(function (fbRes) {
            var feedback = (fbRes.ok && Array.isArray(fbRes.j)) ? fbRes.j : [];
            render(relaties, feedback, kleurVan);
          })
          .catch(function () { render(relaties, [], kleurVan); });
      })
      .catch(function () {
        root.innerHTML = HEAD + '<div class="fb-laad">Er ging iets mis met de verbinding. Ververs de pagina en probeer het nog eens.</div>';
      });
  }

  function render(relaties, feedback, kleurVan) {
    var relatieNaam = {}; relaties.forEach(function (r) { relatieNaam[r.id] = r.naam; });
    var ontvangen = relaties.filter(function (r) { return r.feedback_ontvangen; }).length;
    var sub = '<div class="fb-sub">' + ontvangen + ' van ' + relaties.length + ' ' + (relaties.length === 1 ? 'persoon heeft' : 'mensen hebben') + ' gereageerd</div>';

    if (!feedback.length) {
      root.innerHTML = HEAD + sub + '<div class="fb-leeg">Nog geen feedback ontvangen. Zodra iemand het formulier invult, verschijnen de antwoorden hier.</div>';
      return;
    }

    // Volgorde van indienen: wie het eerst feedback gaf, staat bij elke vraag bovenaan.
    // Moment van indienen = feedback_op van de relatie, anders het vroegste ingevuld_op van zijn antwoorden.
    var relatieIndex = {}; relaties.forEach(function (r, i) { relatieIndex[r.id] = i; });
    var ingediendOp = {};
    relaties.forEach(function (r) { if (r.feedback_op) ingediendOp[r.id] = Date.parse(r.feedback_op); });
    feedback.forEach(function (f) {
      var t = f.ingevuld_op ? Date.parse(f.ingevuld_op) : NaN;
      if (isNaN(t)) return;
      if (ingediendOp[f.relatie_id] === undefined || isNaN(ingediendOp[f.relatie_id])) ingediendOp[f.relatie_id] = t;
      else if (!relaties.some(function (r) { return r.id === f.relatie_id && r.feedback_op; })) ingediendOp[f.relatie_id] = Math.min(ingediendOp[f.relatie_id], t);
    });
    function tijdVan(id) { var t = ingediendOp[id]; return (t === undefined || isNaN(t)) ? Infinity : t; }

    var perVraag = {};
    var volgorde = [];
    feedback.forEach(function (f) {
      if (!perVraag[f.vraag_nr]) { perVraag[f.vraag_nr] = { vraag: f.vraag, items: [] }; volgorde.push(f.vraag_nr); }
      perVraag[f.vraag_nr].items.push({ relatie_id: f.relatie_id, naam: relatieNaam[f.relatie_id] || 'Onbekend', kleur: kleurVan[f.relatie_id] || '#999', antwoord: f.antwoord });
    });
    volgorde.sort(function (a, b) { return a - b; });
    volgorde.forEach(function (nr) {
      perVraag[nr].items.sort(function (a, b) {
        var ta = tijdVan(a.relatie_id), tb = tijdVan(b.relatie_id);
        if (ta !== tb) return ta - tb;
        return (relatieIndex[a.relatie_id] || 0) - (relatieIndex[b.relatie_id] || 0);
      });
    });

    var blokken = volgorde.map(function (nr) {
      var d = perVraag[nr];
      var items = d.items.map(function (a) {
        return '<div class="fb-item" style="border-left-color:' + a.kleur + '">' +
          '<div class="fb-naam" style="color:' + a.kleur + '">' + esc(a.naam) + '</div>' +
          '<div class="fb-tekst">' + esc(a.antwoord || '—') + '</div></div>';
      }).join('');
      return '<div class="fb-blok"><div class="fb-vraag">' + esc(d.vraag) + '</div>' + items + '</div>';
    }).join('');

    root.innerHTML = HEAD + sub + blokken;
  }

  function controleer() {
    var nu = leesSessie();
    if (nu && (!session || nu.token !== session.token)) { session = nu; laad(); }
    else if (!nu && session) { session = null; toonSlot(); }
  }
  window.addEventListener('storage', controleer);
  document.addEventListener('visibilitychange', controleer);
  setInterval(controleer, 1500);

  session = leesSessie();
  if (session) laad(); else toonSlot();
})();
</script>
